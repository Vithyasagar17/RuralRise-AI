<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RuralRise AI — Offline</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; font-size: 18px; line-height: 1.5;
             background: #ffffff; color: #1a1a1a; }
      main { max-width: 32rem; margin: 0 auto; padding: 24px 16px; }
      h1 { font-size: 1.5rem; color: #1f6f4a; }
      a { display: inline-block; margin-top: 16px; padding: 12px 20px; min-height: 44px;
          box-sizing: border-box; background: #1f6f4a; color: #fff; border-radius: 8px;
          text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 3px solid #b45309; outline-offset: 2px; }
      @media (prefers-color-scheme: dark) {
        body { background: #121212; color: #f2f2f2; }
        h1 { color: #6fcf97; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>RuralRise AI cannot reach the internet right now.</p>
      <p>Lessons you opened before going offline are saved on this phone.
         Open the app again to read them. Your progress will be saved on this phone
         and sent when you are back online.</p>
      <a href="/">Open RuralRise AI</a>
    </main>
  </body>
</html>
